<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novenix</title>

      <!-- SEO -->
  <meta name="description"
    content="Portfolio interattivo di Giuseppe Pentrelli, Full Stack Web Developer. Esplora progetti, competenze e contatti in un viaggio interstellare nel web.">
  <meta name="keywords"
    content="Giuseppe Pentrelli, Novenix, portfolio, programmatore, sviluppatore web, full stack, frontend, backend, HTML, CSS, JavaScript, PHP, Laravel, Bootstrap">
  <link rel="canonical" href="https://novenix.altervista.org/">
  <meta name="theme-color" content="rgb(8, 25, 41)">
  <meta name="author" content="Giuseppe Pentrelli">

    <!-- favicon: PNG per i browser normali, SVG per chi lo supporta, .ico come vecchio fallback -->
    <link rel="icon" type="image/png" href="/icon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
    <link rel="shortcut icon" href="/icon/favicon.ico" />
    
    <!-- icona quando si salva il sito in home su iPhone/iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />

    <!-- manifest PWA: nome/icone se uno "installa" il sito -->
    <link rel="manifest" href="/icon/site.webmanifest" />

    <!-- font Anta self-hosted (vedi @font-face in index.css), preload per non far aspettare il rendering -->
    <link rel="preload" href="/fonts/anta-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
